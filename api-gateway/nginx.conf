events {}

http {
    upstream member_service {
        server member-service:8000;
    }

    upstream peminjaman_service {
        server peminjaman-service:8000;
    }

    upstream katalog_buku_service {
        server katalog-buku-service:8000;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 20m;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        location = / {
            default_type application/json;
            return 200 '{"status":"ok","gateway":"tubes-iae-kelompok-5","routes":["/health","/api/v1/auth/token","/api/v1/members","/api/v1/books","/api/v1/loans","/graphql","/member/","/katalog/","/peminjaman/"]}\n';
        }

        location = /health {
            default_type application/json;
            return 200 '{"status":"ok"}\n';
        }

        location = /api/v1/auth/token {
            proxy_ssl_server_name on;
            proxy_set_header Host iae-sso.virtualfri.id;
            proxy_pass https://iae-sso.virtualfri.id;
        }

        location = /graphql {
            proxy_pass http://member_service;
        }

        location = /graphiql {
            proxy_pass http://member_service;
        }

        location = /graphql-playground {
            proxy_pass http://member_service;
        }

        location ^~ /api/v1/members {
            proxy_pass http://member_service;
        }

        location ^~ /api/v1/books {
            proxy_pass http://katalog_buku_service;
        }

        location ^~ /api/v1/loans {
            proxy_pass http://peminjaman_service;
        }

        location = /member {
            return 302 /member/;
        }

        location ^~ /member/ {
            rewrite ^/member/?(.*)$ /$1 break;
            proxy_pass http://member_service;
        }

        location = /katalog {
            return 302 /katalog/;
        }

        location ^~ /katalog/ {
            rewrite ^/katalog/?(.*)$ /$1 break;
            proxy_pass http://katalog_buku_service;
        }

        location = /peminjaman {
            return 302 /peminjaman/;
        }

        location ^~ /peminjaman/ {
            rewrite ^/peminjaman/?(.*)$ /$1 break;
            proxy_pass http://peminjaman_service;
        }
    }
}
