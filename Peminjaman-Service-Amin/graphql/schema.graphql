type Loan {
    id: ID!
    member_id: Int!
    book_id: Int!
    borrow_date: String!
    return_date: String
    status: String!
    created_at: String
    updated_at: String
}

type Query {
    "Ambil semua transaksi peminjaman"
    loans: [Loan!]! @all

    "Ambil detail peminjaman berdasarkan ID"
    loan(id: ID! @eq): Loan @find
}